name: macOS repro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    # the bug reproduces only on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          # 'rc' is not a valid quality, RC builds are published with the 'preview' quality
          dotnet-quality: 'preview'

      - name: Print SDK info
        run: dotnet --info

      - name: Build
        run: |
          dotnet build src/ProcessKillRepro/ProcessKillRepro.csproj -c Release
          dotnet build src/Watchdog/Watchdog.csproj -c Release

      - name: Run the repro under the watchdog
        run: ./src/Watchdog/bin/Release/net11.0/Watchdog ./src/ProcessKillRepro/bin/Release/net11.0/ProcessKillRepro
